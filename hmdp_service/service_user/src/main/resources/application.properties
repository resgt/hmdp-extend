server.port=8160
spring.application.name=service-user

spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://172.31.88.233:3306/hmdp?characterEncoding=utf-8&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

spring.redis.host=172.31.88.233
spring.redis.port=6379
spring.redis.database= 0
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.time-between-eviction-runs=10s

spring.cloud.nacos.discovery.server-addr=172.31.88.233:8848

mybatis-plus.mapper-locations=classpath:com/hmdp/user/mapper/xml/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

spring.jackson.default-property-inclusion=non_null

logging.level.com.hmdp=debug

# Dubbo配置
dubbo.application.name=${spring.application.name}
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
dubbo.registry.address=nacos://${spring.cloud.nacos.discovery.server-addr}
dubbo.provider.timeout=3000
dubbo.provider.retries=0
dubbo.provider.loadbalance=roundrobin