# 服务端口
server.port=8161
# 服务名
spring.application.name=service-shop

# mysql数据库连接
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://172.27.52.12:3306/hmdp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# redis连接
spring.redis.host=172.27.52.12
spring.redis.port=6379
spring.redis.database= 0
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.time-between-eviction-runs=10s

# nacos服务地址
spring.cloud.nacos.discovery.server-addr=172.27.52.12:8848

#配置mapper xml文件的路径
mybatis-plus.mapper-locations=classpath:com/hmdp/shop/mapper/xml/*.xml
# 开启驼峰命名法，在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JSON处理时忽略非空字段
spring.jackson.default-property-inclusion=non_null

# Canal配置
canal.destination=hmdp
canal.server=172.27.52.12:11111

# RocketMQ配置
rocketmq.name-server=172.27.52.12:9876
rocketmq.producer.group=shop-service

logging.level.com.hmdp=debug