# 服务端口
server.port=8163
# 服务名
spring.application.name=service-voucher

# mysql数据库连接
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://172.27.52.12:3306/hmdp?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# redis连接
spring.redis.host=172.27.52.12
spring.redis.port=6379
spring.redis.database= 0
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.time-between-eviction-runs=10s



# nacos服务地址
spring.cloud.nacos.discovery.server-addr=172.27.52.12:8848

#配置mapper xml文件的路径
mybatis-plus.mapper-locations=classpath:com/hmdp/voucher/mapper/xml/*.xml
# 开启驼峰命名法，在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
mybatis-plus.configuration.map-underscore-to-camel-case=true

# JSON处理时忽略非空字段
spring.jackson.default-property-inclusion=non_null

# RocketMQ配置
rocketmq.name-server=172.27.52.12:9876
rocketmq.producer.group=voucher-producer-group
rocketmq.consumer.group=voucher-consumer-group

# RocketMQ重试配置
rocketmq.consumer.maxReconsumeTimes=3
# 重试间隔时间，单位毫秒，默认每次重试间隔时间翻倍
rocketmq.consumer.reconsumeTimes=1000,5000,10000
# 是否开启死信队列
rocketmq.consumer.enableMsgTrace=true
# 死信队列主题
rocketmq.consumer.dlqTopic=DLQ_VOUCHER_ORDER_TOPIC

# ShardingSphere配置
spring.shardingsphere.datasource.names=master

# 数据源配置
spring.shardingsphere.datasource.master.type=com.zaxxer.hikari.HikariDataSource
spring.shardingsphere.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.shardingsphere.datasource.master.jdbc-url=jdbc:mysql://172.27.52.12:3306/hmdp?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
spring.shardingsphere.datasource.master.username=root
spring.shardingsphere.datasource.master.password=123456

# 分片规则配置
spring.shardingsphere.sharding.tables.tb_voucher_order.actual-data-nodes=master.tb_voucher_order_$->{0..15}
spring.shardingsphere.sharding.tables.tb_voucher_order.table-strategy.inline.sharding-column=user_id
spring.shardingsphere.sharding.tables.tb_voucher_order.table-strategy.inline.algorithm-expression=tb_voucher_order_$->{user_id % 16}
spring.shardingsphere.sharding.tables.tb_voucher_order.key-generator.column=id
spring.shardingsphere.sharding.tables.tb_voucher_order.key-generator.type=SNOWFLAKE

# 打印SQL
spring.shardingsphere.props.sql.show=true

# Sentinel配置
spring.cloud.sentinel.transport.dashboard=172.27.52.12:8080
spring.cloud.sentinel.transport.port=8719
spring.cloud.sentinel.eager=true
feign.sentinel.enabled=true

# Dubbo配置
dubbo.application.name=${spring.application.name}
dubbo.registry.address=nacos://${spring.cloud.nacos.discovery.server-addr}
dubbo.consumer.timeout=3000
dubbo.consumer.check=false
dubbo.consumer.retries=0
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880

logging.level.com.hmdp=debug